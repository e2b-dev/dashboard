openapi: "3.0.0"

info:
  version: 0.1.0
  title: E2B Dashboard API

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AdminApiKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-Token
    AdminJWTAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    # AuthProviderBearerAuth / AuthProviderTeamAuth: B before T in the name
    # so Bearer is validated before Team.
    AuthProviderBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: access_token
    AuthProviderTeamAuth:
      type: apiKey
      in: header
      name: X-Team-ID

  parameters:
    sandboxID:
      name: sandboxID
      in: path
      required: true
      description: Identifier of the sandbox.
      schema:
        type: string
    teamID:
      name: teamID
      in: path
      required: true
      description: Identifier of the team.
      schema:
        type: string
        format: uuid
    clusterID:
      name: clusterID
      in: path
      required: true
      description: Identifier of the cluster.
      schema:
        type: string
        format: uuid
    projectID:
      name: projectID
      in: path
      required: true
      description: Identifier of the project.
      schema:
        type: string
        format: uuid
  responses:
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "401":
      description: Authentication error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "500":
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code.
        error_code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Error message.

    ErrorCode:
      type: string
      description: >-
        Stable machine-readable reason for an API error. New codes may be added
        as other errors adopt this contract. Clients must handle absent or unknown
        codes without interpreting the human-readable message.
      enum:
        - cluster_registration_invalid
        - cluster_registration_conflict
        - cluster_assignment_invalid
        - cluster_assignment_project_not_found
        - cluster_assignment_cluster_not_found
        - cluster_assignment_already_assigned
        - cluster_assignment_cluster_deleting

    AdminAuthProviderProfile:
      type: object
      required:
        - userId
        - email
      properties:
        userId:
          type: string
          format: uuid
          description: Internal E2B user identifier.
        email:
          type: string
          nullable: true
          description: Email address from the configured auth provider.

    AdminAuthProviderProfilesResponse:
      type: object
      required:
        - profiles
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuthProviderProfile"

    AdminAuthProviderProfilesResolveRequest:
      type: object
      required:
        - userIds
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid

    AdminClusterCreateRequest:
      type: object
      required:
        - name
        - endpoint
        - endpoint_tls
        - token
      properties:
        cluster_id:
          type: string
          format: uuid
          description: Optional stable identifier for idempotent creation. Reuse succeeds only when the immutable configuration is identical.
        name:
          type: string
          minLength: 1
        endpoint:
          type: string
          minLength: 1
        endpoint_tls:
          type: boolean
        token:
          type: string
          minLength: 1
        sandbox_proxy_domain:
          type: string
          nullable: true
        auth_org_id:
          type: string
          nullable: true

    AdminClusterCreateResponse:
      type: object
      required:
        - cluster_id
      properties:
        cluster_id:
          type: string
          format: uuid

    AdminTeamClusterAssignmentResponse:
      type: object
      required:
        - cluster_id
      properties:
        cluster_id:
          type: string
          format: uuid

    CPUCount:
      type: integer
      format: int64
      minimum: 1
      description: CPU cores for the sandbox

    MemoryMB:
      type: integer
      format: int64
      minimum: 128
      description: Memory for the sandbox in MiB

    DiskSizeMB:
      type: integer
      format: int64
      minimum: 0
      description: Disk size for the sandbox in MiB

    SandboxRecord:
      type: object
      required:
        - templateID
        - sandboxID
        - startedAt
        - cpuCount
        - memoryMB
        - diskSizeMB
        - retentionExpired
        - eventsRetentionExpired
      properties:
        templateID:
          type: string
          description: Identifier of the template from which is the sandbox created
        alias:
          type: string
          description: Alias of the template
        sandboxID:
          type: string
          description: Identifier of the sandbox
        startedAt:
          type: string
          format: date-time
          description: Time when the sandbox was started
        stoppedAt:
          type: string
          format: date-time
          nullable: true
          description: Time when the sandbox was stopped
        domain:
          type: string
          nullable: true
          description: Base domain where the sandbox traffic is accessible
        cpuCount:
          $ref: "#/components/schemas/CPUCount"
        memoryMB:
          $ref: "#/components/schemas/MemoryMB"
        diskSizeMB:
          $ref: "#/components/schemas/DiskSizeMB"
        retentionExpired:
          type: boolean
          description: Whether the sandbox ended more than the fixed retention window ago, so its monitoring and logs data is no longer available
        eventsRetentionExpired:
          type: boolean
          description: Whether the sandbox ended more than the team's events retention window ago, so its events data is no longer available

    HealthResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable health check result.

    ManagementClusterProjects:
      type: object
      required: [project_ids]
      properties:
        project_ids:
          type: array
          items:
            type: string
            format: uuid

    ManagementClusterRegistrationRequest:
      type: object
      required:
        - name
        - endpoint
        - endpoint_tls
        - token
      properties:
        name:
          type: string
          minLength: 1
        endpoint:
          type: string
          minLength: 1
        endpoint_tls:
          type: boolean
        token:
          type: string
          minLength: 1
        sandbox_proxy_domain:
          type: string
          nullable: true
        auth_org_id:
          type: string
          nullable: true

tags:
  - name: control-plane-management
    description: Workspace control-plane operations authenticated with service JWTs.
  - name: sandboxes

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Health check successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /sandboxes/{sandboxID}/record:
    get:
      summary: Sandbox record
      tags: [sandboxes]
      security:
        - AuthProviderBearerAuth: []
          AuthProviderTeamAuth: []
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      responses:
        "200":
          description: Successfully returned sandbox details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxRecord"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /admin/clusters:
    post:
      summary: Create a cluster
      description: Creates a cluster whose configuration cannot be modified. The cluster starts with deletion protection turned on.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminClusterCreateRequest"
      responses:
        "201":
          description: Cluster created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClusterCreateResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /admin/clusters/{clusterID}:
    delete:
      summary: Delete a cluster and its environments
      description: Deletes a cluster after all team assignments are detached. In the same transaction, soft-deletes every live template, snapshot template and paused sandbox snapshot on the cluster, releases their aliases, and releases all environment references while preserving environment and build history. A team assignment rejects the deletion and leaves the environments untouched, and so does deletion protection on the cluster. The local cluster's nil ID is rejected. Repeating a completed deletion succeeds.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/clusterID"
      responses:
        "204":
          description: Cluster deleted or already absent.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /v1/management/clusters/{clusterID}/projects:
    get:
      operationId: managementListClusterProjects
      summary: List the projects assigned to a cluster (v1).
      description: Returns the ID of every project whose team is assigned to the cluster, whichever way it was assigned. A deleted project is never assigned. An absent cluster has no projects.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/clusterID"
      responses:
        "200":
          description: The projects assigned to the cluster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementClusterProjects"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /v1/management/clusters/{clusterID}/deletion:
    put:
      operationId: managementRequestClusterDeletion
      summary: Record that a cluster is being deleted (v1).
      description: Records that the caller is deleting the cluster, for a caller that deletes the cluster's teams before the cluster itself. Refused while the cluster has deletion protection turned on; a protection change in flight commits before or after the check, never between. Once recorded, deletion protection cannot be turned on, so the cluster delete that follows is not refused for protection, and no team can be newly assigned to the cluster. An assignment either commits before the deletion is recorded, where the caller's next project listing finds it, or is refused with cluster_assignment_cluster_deleting. Succeeds when the cluster is absent. Repeating the request succeeds. The local cluster's nil ID is rejected.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/clusterID"
      responses:
        "204":
          description: The deletion is recorded, or the cluster is absent.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          description: The cluster has deletion protection turned on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/500"

  /v1/management/clusters/{clusterID}/destroy-readiness:
    get:
      operationId: managementClusterDestroyReadiness
      summary: Check cluster destroy readiness
      description: Checks whether the cluster has deletion protection turned on, or more than one team uses this exact cluster, either as an assigned team or as the owner of active templates or snapshots on it. One team's own templates and snapshots do not block this check, because deleting the cluster soft-deletes them. Soft-deleted history does not count. Returns success if the cluster is absent. This read does not change resources or prevent later assignments or template creation.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/clusterID"
      responses:
        "204":
          description: At most one team uses the cluster.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          description: The cluster has deletion protection turned on, or more than one team uses it and the other teams and their templates must move off it before destroying the cluster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/500"

  /admin/teams/{teamID}/cluster:
    get:
      summary: Get a team's assigned cluster
      description: Returns the current cluster assignment without exposing cluster credentials.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/teamID"
      responses:
        "200":
          description: Cluster assignment returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeamClusterAssignmentResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
  /admin/user-profiles/resolve:
    post:
      summary: Resolve user profiles
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAuthProviderProfilesResolveRequest"
      responses:
        "200":
          description: Successfully resolved profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthProviderProfilesResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /v1/management/clusters/{clusterID}:
    parameters:
      - $ref: "#/components/parameters/clusterID"
    put:
      operationId: managementRegisterCluster
      summary: Register a cluster (v1).
      description: A cluster registered here for the first time starts with deletion protection turned off. Registering an existing cluster again with the same name and auth organization updates its endpoint, TLS setting, sandbox proxy domain and token and keeps its stored deletion protection; a different name or auth organization returns a conflict.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementClusterRegistrationRequest"
      responses:
        "204":
          description: Cluster registration is present.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
    delete:
      operationId: managementDeleteCluster
      summary: Delete a cluster and its environments (v1).
      description: Deletes a cluster after all team assignments are detached. In the same transaction, soft-deletes every live template, snapshot template and paused sandbox snapshot on the cluster, releases their aliases, and releases all environment references while preserving environment and build history. A team assignment rejects the deletion and leaves the environments untouched, and so does deletion protection on the cluster. The local cluster's nil ID is rejected. Repeating a completed deletion succeeds.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      responses:
        "204":
          description: Cluster is absent.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /v1/management/projects/{projectID}/cluster/{clusterID}:
    parameters:
      - $ref: "#/components/parameters/projectID"
      - $ref: "#/components/parameters/clusterID"
    put:
      operationId: managementAssignProjectCluster
      summary: Assign a cluster to a project (v1).
      description: >-
        Assigns the cluster when the project has no cluster assigned. Replaying the identical
        assignment succeeds; replacing a different assigned cluster returns a conflict.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      responses:
        "204":
          description: Cluster is assigned to the project.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
    delete:
      operationId: managementDetachProjectCluster
      summary: Detach a cluster assignment from a project (v1).
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      responses:
        "204":
          description: The matching assignment is absent.
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
